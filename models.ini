[gemini_models]
# Priority list of models to use in order.
# If a model hits rate limit (429), high demand (503), or is unavailable,
# the system automatically falls back to the next model in this list.
model_1 = gemini-3.1-flash-lite
model_2 = gemini-2.5-flash-lite
model_3 = gemini-3-flash-preview
model_4 = gemini-2.5-flash
model_5 = gemini-3.8-flash
model_6 = gemini-3.1-pro-preview
model_7 = gemini-2.5-pro

[settings]
# Temperature for RAG QA generation
temperature = 0.0
# Max retries per model before switching
max_retries_per_model = 2
# Timeout in seconds
timeout = 30
